server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # DOCKER FIX - sendfile off
    # ============================================
    # Docker volume-okkal sendfile problémás lehet
    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;

    # ============================================
    # SECURITY HEADERS
    # ============================================
    # UI-TT-159: ezek a fejlécek KORÁBBAN is itt álltak, mégis nulla biztonsági fejléccel
    # ment ki minden HTML-válasz. Az ok az nginx `add_header` öröklődési szabálya: egy
    # `location` blokk NEM örökli a szülő szint add_header-eit, ha SAJÁT add_header-t
    # tartalmaz — és lentebb mind a három location blokknak van (Cache-Control / Expires /
    # Accept-Ranges miatt). Így pont a felhasználó által megnyitott oldalak (a `location /`
    # SPA-ága) veszítették el mindet, miközben a szerver-szintű deklaráció "helyesnek"
    # látszott a configot olvasva.
    #
    # Megoldás: egy külön fájlba emelt fejléc-blokk, amit MINDEN location `include`-ol.
    # Így az öröklődési szabály nem tud csendben kihagyni egy útvonalat, és új location
    # hozzáadásakor is egy sor a teendő.
    include /etc/nginx/conf.d/security-headers.inc;

    # ============================================
    # GZIP COMPRESSION
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ============================================
    # STATIC ASSETS (képek, fontok, stb.)
    # ============================================
    location /assets/ {
        # UI-TT-159: kötelező, mert az alábbi add_header-ek különben kizárnák a
        # szerver-szintű biztonsági fejléceket ebből a blokkból.
        include /etc/nginx/conf.d/security-headers.inc;

        # 1 éves cache (immutable fájlok)
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Partial content támogatás kikapcsolása (Docker fix)
        add_header Accept-Ranges "none";

        # Gzip kikapcsolása már tömörített fájloknál (jpg, png, woff2)
        gzip off;

        # Ha nem található, 404
        try_files $uri =404;
    }

    # ============================================
    # JAVASCRIPT/CSS FÁJLOK
    # ============================================
    location ~* \.(js|css)$ {
        # UI-TT-159: lásd fent — az add_header itt is kizárná a szerver-szintűeket.
        include /etc/nginx/conf.d/security-headers.inc;

        # Rövid cache (ha van hash a fájlnévben, lehet hosszabb)
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Gzip engedélyezése
        gzip on;
    }

    # ============================================
    # ANGULAR ROUTING (SPA)
    # ============================================
    location / {
        # UI-TT-159: EZ volt a tényleges kiesés helye — a felhasználó által megnyitott
        # összes SPA-oldal (`/login`, `/feladatsorok`, …) ezen az ágon megy ki, és az
        # alábbi Cache-Control add_header miatt egyetlen biztonsági fejlécet sem kapott.
        include /etc/nginx/conf.d/security-headers.inc;

        # Próbáld meg a fájlt, ha nincs → index.html (SPA routing)
        try_files $uri $uri/ /index.html;

        # index.html NE legyen cache-elve (mindig friss verzió)
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ============================================
    # ERROR HANDLING
    # ============================================
    error_page 404 /index.html;

    # ============================================
    # LOGGING
    # ============================================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
